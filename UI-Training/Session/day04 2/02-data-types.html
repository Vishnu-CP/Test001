  <script type="-">
    // Plain Object

    var vObj = {
      'myName' : 'JavaScript',
      age: 30,
      'alt name': 'ECMA Script'
    };
    console.log('🚀 ~ vObj', vObj);
    console.log('🚀 ~ altName', vObj['alt name']);

    vObj['0'] = 'Testing number key'

    vObj.isActive = true;
    console.log('🚀 ~ vObj', vObj);

    for(var key in vObj) {
      console.log(`🚀 ~  `, key, vObj[key]);
    }

    var name = 'Javascript';
    var age = 30;
    var isActive = true;

    var nObj1 = {
      'name': name,
      'age': age,
      'isActive': isActive
    };
    console.log('🚀 ~ nObj1', nObj1);

    var nObj2 = {
      name: name,
      age: age,
      isActive: isActive
    };
    console.log('🚀 ~ nObj2', nObj2);

    var nObj3 = {
      name,
      age,
      isActive
    };
    console.log('🚀 ~ nObj3', nObj3);

    var vTestArr = [10, 20, 30, nObj3];

    vTestArr['xyz'] = 'Abc';

    console.log('🚀 ~ vTestArr', vTestArr);

    let laptop = {
      brand: 'Apple',
      model: 'MacBook Pro',
      year: 2023,
      processor: 'M2',
      mfgDetails: {
        country: 'China',
        mfgOn: '2022-11'
      }
    };
    console.log('🚀 ~ laptop', laptop);
  </script>

  <script type="-">
    // Function

    function doSomething (a, b, c) {
      console.log('🚀 ~ a, b, c', a, b, c);
      console.log(`🚀 ~  inside doSomething`, arguments);
    }

    function doSomething (a, b, c, d) {
      console.log('🚀 ~ a, b, c', a, b, c);
      console.log(`🚀 ~  inside doSomething`, arguments);

      return a+ b + c + d;
    }

    var fnRes = doSomething(10, 20, 30, 40, 50, 60);
    console.log('🚀 ~ fnRes', fnRes);
  </script>

  <script type="-">
    function doSomething (a, b) {
      console.log(`🚀 ~  inside doSomething`);
      return a+b;
    }

    var doSomethingElse = function _doSomethingElse () {
      console.log(`🚀 ~  inside doSomethingElse`);

      return arguments[0]*arguments[1];
    }

    var fRes = doSomethingElse(10,20);
    console.log('🚀 ~ fRes', fRes);

  </script>

  <script type="-">
    // arrow functions

    var doSomething0 = function(a,b){
      return a+b;
    };

    var doSomething1 = (a,b) => {
      return a+b;
    };

    var doSomething2 = (a,b) => a+b;

    var doSomething3 = a => a*a;

    var doSomething4 = () => 100;

  </script>

  <script>
    // IIFE - Immeidately Invoked Function Expression

    (function(a){
      console.log(`🚀 ~  inside IIFE`, a);
      console.log(`🚀 ~  arguments`, arguments);
    })(10);


    ((a)=>{
      console.log(`🚀 ~  inside arrow IIFE`, a);
      // console.log(`🚀 ~  arguments`, arguments);
    })(100);

    ( function(a){
      console.log(`🚀 ~  inside alternate syntax of IIFE`, a);
      console.log(`🚀 ~  arguments`, arguments);
    }(200) )

  </script>
