  <h1>Closure</h1>
  <p>is a state of a function, which encloses/holds its surrounding(outer) states,
     even after the outer function finished its execution.</p>

  <script type="-">
    function outer ( x ) {

      var a = 2; // This variable is "private"

      function inner ( y ) {
        // closure for a and x
        return (x + y) * a;
      }

      return inner;
    }

    var outResult = outer(10);
    console.log('🚀 ~ outResult', outResult);

  </script>

  <script type="-">
    function createCounter() {
      let count = 0; // This variable is "private"

      return {
        current: function () {
          return count;
        },
        next: function () {
          count++;
          return count;
        }
      };
    }

    var myCounter = createCounter();

  </script>
