<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/x-icon;base64," />
  <title>localStorage - 01</title>
</head>
<body>
  <h1>localStorage - 01</h1>

  <input type="text" id="apiKey" value="">
  <button id="btnStore">Store</button>
  <button id="btnRemove">Remove</button>

  <br />
  <a href="localStorage-02.html">Page-2</a> |
  <a href="localStorage-02.html" target="_blank">Page-2 (New Tab)</a>

  <script>
    // localStorage
    // localStorage.getItem
    // localStorage.setItem
    // localStorage.removeItem

    document.getElementById('apiKey').value = localStorage.getItem('apiKey');

    document.getElementById('btnStore').addEventListener('click', () => {
      localStorage.setItem('apiKey', document.getElementById('apiKey').value);
    });

    document.getElementById('btnRemove').addEventListener('click', () => {
      localStorage.removeItem('apiKey');
    });

  </script>


</body>
</html>
